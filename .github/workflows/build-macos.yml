name: Build macOS
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PortAudio
        run: brew install portaudio
      - name: Clean build dir
        run: rm -rf build dist
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Prepare app bundle
        run: |
          mkdir -p dist/GenMusicAudioEngine.app/Contents/MacOS
          mkdir -p dist/GenMusicAudioEngine.app/Contents/Frameworks

          cp build/GenMusicAudioEngine dist/GenMusicAudioEngine.app/Contents/MacOS/

          REAL_PORTAUDIO_LIB=$(python3 -c 'import os; print(os.path.realpath("'"$(brew --prefix portaudio)"'/lib/libportaudio.2.dylib"))')
          cp "$REAL_PORTAUDIO_LIB" dist/GenMusicAudioEngine.app/Contents/Frameworks/libportaudio.2.dylib

          install_name_tool -change "$(brew --prefix portaudio)/lib/libportaudio.2.dylib" "@executable_path/../Frameworks/libportaudio.2.dylib" dist/GenMusicAudioEngine.app/Contents/MacOS/GenMusicAudioEngine

          cat > dist/GenMusicAudioEngine.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.yourname.genmusicaudioengine</string>
              <key>CFBundleName</key>
              <string>GenMusicAudioEngine</string>
              <key>CFBundleExecutable</key>
              <string>GenMusicAudioEngine</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>This app needs microphone access for audio input</string>
              <key>NSAudioInputUsageDescription</key>
              <string>This app needs audio input access</string>
          </dict>
          </plist>
          EOF

          chmod +x dist/GenMusicAudioEngine.app/Contents/MacOS/GenMusicAudioEngine

          codesign --force --sign - dist/GenMusicAudioEngine.app/Contents/Frameworks/libportaudio.2.dylib
          codesign --force --sign - dist/GenMusicAudioEngine.app

          otool -L dist/GenMusicAudioEngine.app/Contents/MacOS/GenMusicAudioEngine

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenMusicAudioEngine-macos
          path: dist/GenMusicAudioEngine.app
