name: Build macOS
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PortAudio
        run: brew install portaudio
      - name: Clean build dir
        run: rm -rf build dist
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Prepare distributable folder
        run: |
          mkdir -p dist/GenMusicAudioEngine-macos
          cp build/GenMusicAudioEngine dist/GenMusicAudioEngine-macos/
          REAL_PORTAUDIO_LIB=$(python3 -c 'import os; print(os.path.realpath("'"$(brew --prefix portaudio)"'/lib/libportaudio.2.dylib"))')
          cp "$REAL_PORTAUDIO_LIB" dist/GenMusicAudioEngine-macos/libportaudio.2.dylib
          install_name_tool -change "$(brew --prefix portaudio)/lib/libportaudio.2.dylib" "@executable_path/libportaudio.2.dylib" dist/GenMusicAudioEngine-macos/GenMusicAudioEngine
          chmod +x dist/GenMusicAudioEngine-macos/GenMusicAudioEngine
          codesign --force --sign - dist/GenMusicAudioEngine-macos/libportaudio.2.dylib
          codesign --force --sign - dist/GenMusicAudioEngine-macos/GenMusicAudioEngine
          cat > dist/GenMusicAudioEngine-macos/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.yourname.genmusicaudioengine</string>
              <key>CFBundleName</key>
              <string>GenMusicAudioEngine</string>
              <key>CFBundleExecutable</key>
              <string>GenMusicAudioEngine</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>This app needs microphone access for audio input</string>
          </dict>
          </plist>
          EOF
          cat > dist/GenMusicAudioEngine-macos/Start.command <<'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$DIR" || exit 1
          echo "DIR=$DIR"
          xattr -cr "$DIR"
          chmod u+w "$DIR/libportaudio.2.dylib" "$DIR/GenMusicAudioEngine"
          codesign --remove-signature "$DIR/libportaudio.2.dylib" 2>/dev/null || true
          codesign --remove-signature "$DIR/GenMusicAudioEngine" 2>/dev/null || true
          codesign --force --timestamp=none --sign - "$DIR/libportaudio.2.dylib" || exit 1
          codesign --force --timestamp=none --sign - "$DIR/GenMusicAudioEngine" || exit 1
          ./GenMusicAudioEngine
          EOF
          chmod +x dist/GenMusicAudioEngine-macos/Start.command
          otool -L dist/GenMusicAudioEngine-macos/GenMusicAudioEngine
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenMusicAudioEngine-macos
          path: dist/GenMusicAudioEngine-macos
